[project]
name = "cafe-reviews"
version = "0.1.0"
description = "What separates 5-star cafe reviews in Bengaluru (Zomato, circa 2019)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "duckdb",
    "pandera",
    "scikit-learn",
    "statsmodels",
    "shap",
    "matplotlib",
    "plotly",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cafe_reviews"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
